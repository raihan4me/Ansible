---
- name: Apply baseline configuration
  hosts: all
  become: true
  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ baseline_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create admin group
      ansible.builtin.group:
        name: "{{ baseline_admin_group }}"
        state: present

    - name: Create admin users
      ansible.builtin.user:
        name: "{{ item.name }}"
        uid: "{{ item.uid }}"
        comment: "{{ item.comment }}"
        groups: "{{ baseline_admin_group }}"
        append: true
        shell: /bin/bash
        state: present
      loop: "{{ baseline_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Grant admin group sudo rights
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-devops
        content: "%{{ baseline_admin_group }} ALL=(ALL:ALL) ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Deploy message of the day
      ansible.builtin.template:
        src: motd.j2
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"

    - name: Harden SSH daemon
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*{{ item.key }}\s'
        line: "{{ item.key }} {{ item.value }}"
        validate: /usr/sbin/sshd -t -f %s
      loop: "{{ sshd_settings }}"
      loop_control:
        label: "{{ item.key }}"
      notify: Restart ssh

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
